<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rolleirecord</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Rolleirecord" />
    <link rel="manifest" href="site.webmanifest" />
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <!-- Phosphor icons, pencil-simple -->
      <symbol
        id="icon-edit"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <path
          d="M92.69,216H48a8,8,0,0,1-8-8V163.31a8,8,0,0,1,2.34-5.65L165.66,34.34a8,8,0,0,1,11.31,0L221.66,79a8,8,0,0,1,0,11.31L98.34,213.66A8,8,0,0,1,92.69,216Z"
        />
        <line x1="136" y1="64" x2="192" y2="120" />
      </symbol>
      <!-- Phosphor icons, plus-circle -->
      <symbol
        id="icon-add"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <circle cx="128" cy="128" r="96" />
        <line x1="88" y1="128" x2="168" y2="128" />
        <line x1="128" y1="88" x2="128" y2="168" />
      </symbol>
      <!-- Phosphor icons, trash-simple -->
      <symbol
        id="icon-delete"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <line x1="216" y1="60" x2="40" y2="60" />
        <line x1="88" y1="20" x2="168" y2="20" />
        <path d="M200,60V208a8,8,0,0,1-8,8H64a8,8,0,0,1-8-8V60" />
      </symbol>
      <!-- Phosphor icons, arrow-down -->
      <symbol
        id="icon-down"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <line x1="128" y1="40" x2="128" y2="216" />
        <polyline points="56 144 128 216 200 144" />
      </symbol>
      <!-- Phosphor icons, arrow-up -->
      <symbol
        id="icon-up"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <line x1="128" y1="216" x2="128" y2="40" />
        <polyline points="56 112 128 40 200 112" />
      </symbol>
      <!-- Phosphor icons, scroll -->
      <symbol
        id="icon-roll"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <path d="M200,176V64a24,24,0,0,0-24-24H40" />
        <line x1="104" y1="92" x2="164" y2="92" />
        <line x1="104" y1="132" x2="164" y2="132" />
        <path
          d="M24,80s-8-6-8-16a24,24,0,0,1,48,0V192a24,24,0,0,0,48,0c0-10-8-16-8-16H216s8,6,8,16a24,24,0,0,1-24,24H88"
        />
      </symbol>
      <!-- Phosphor icons, camera -->
      <symbol
        id="icon-camera"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <path
          d="M208,208H48a16,16,0,0,1-16-16V80A16,16,0,0,1,48,64H80L96,40h64l16,24h32a16,16,0,0,1,16,16V192A16,16,0,0,1,208,208Z"
        />
        <circle cx="128" cy="132" r="36" />
      </symbol>
      <!-- Phosphor icons, film-strip -->
      <symbol
        id="icon-film"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <rect x="32" y="48" width="192" height="160" rx="8" />
        <line x1="128" y1="48" x2="128" y2="208" />
        <line x1="32" y1="88" x2="224" y2="88" />
        <line x1="32" y1="168" x2="224" y2="168" />
        <line x1="80" y1="48" x2="80" y2="88" />
        <line x1="176" y1="48" x2="176" y2="88" />
        <line x1="80" y1="168" x2="80" y2="208" />
        <line x1="176" y1="168" x2="176" y2="208" />
      </symbol>
      <!-- Phosphor icons, arrows-clockwise -->
      <symbol
        id="icon-refresh"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <polyline points="168 96 216 96 216 48" />
        <path d="M216,96,187.72,67.72A88,88,0,0,0,64,67" />
        <polyline points="88 160 40 160 40 208" />
        <path d="M40,160l28.28,28.28A88,88,0,0,0,192,189" />
      </symbol>
      <!-- Phosphor icons, map-pin -->
      <symbol
        id="icon-pin"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <circle cx="128" cy="104" r="32" />
        <path
          d="M208,104c0,72-80,128-80,128S48,176,48,104a80,80,0,0,1,160,0Z"
        />
      </symbol>
      <!-- Phosphor icons, map-trifold -->
      <symbol
        id="icon-map"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <line x1="96" y1="184" x2="96" y2="40" />
        <line x1="160" y1="72" x2="160" y2="216" />
        <polygon
          points="96 184 32 200 32 56 96 40 160 72 224 56 224 200 160 216 96 184"
        />
      </symbol>
      <!-- Phosphor icons, gear-six -->
      <symbol
        id="icon-options"
        viewBox="0 0 256 256"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="24"
      >
        <circle cx="128" cy="128" r="40" />
        <path
          d="M130.05,206.11c-1.34,0-2.69,0-4,0L94,224a104.61,104.61,0,0,1-34.11-19.2l-.12-36c-.71-1.12-1.38-2.25-2-3.41L25.9,147.24a99.15,99.15,0,0,1,0-38.46l31.84-18.1c.65-1.15,1.32-2.29,2-3.41l.16-36A104.58,104.58,0,0,1,94,32l32,17.89c1.34,0,2.69,0,4,0L162,32a104.61,104.61,0,0,1,34.11,19.2l.12,36c.71,1.12,1.38,2.25,2,3.41l31.85,18.14a99.15,99.15,0,0,1,0,38.46l-31.84,18.1c-.65,1.15-1.32,2.29-2,3.41l-.16,36A104.58,104.58,0,0,1,162,224Z"
        />
      </symbol>
    </svg>

    <header>
      <h1>Rolleirecord</h1>
      <button id="settingsBtn" title="Options">
        <svg class="icon"><use href="#icon-options"></use></svg>
      </button>
    </header>
    <main>
      <div id="rollContainer" class="roll-selector-bar">
        <label for="rollSelect" title="Select roll"
          ><svg class="icon"><use href="#icon-roll"></use></svg
        ></label>
        <select id="rollSelect">
          <!-- Options will be populated dynamically -->
        </select>
        <button id="editRollBtn" class="secondary" title="Edit roll">
          <svg class="icon"><use href="#icon-edit"></use></svg>
        </button>
      </div>

      <div class="camera-selector-bar">
        <label for="cameraSelect" title="Select camera"
          ><svg class="icon"><use href="#icon-camera"></use></svg
        ></label>
        <select id="cameraSelect">
          <!-- Options will be populated dynamically -->
        </select>
        <label for="filmSelect" title="Select film"
          ><svg class="icon"><use href="#icon-film"></use></svg
        ></label>
        <select id="filmSelect">
          <!-- Options will be populated dynamically -->
        </select>
      </div>

      <div id="tableContainer">
        <!-- Table will be rendered here -->
      </div>
    </main>

    <footer>
      <div class="controls">
        <button id="exportBtn" class="secondary">Export</button>
        <button id="importBtn" class="secondary">Import</button>
        <button id="clearAllBtn" class="danger">Clear All</button>
      </div>
    </footer>

    <!-- Frame Modal -->
    <div class="modal" id="frameModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="frameModalTitle">Add Row</h2>
        </div>
        <form>
          <div class="modal-body" id="frameModalBody">
            <!-- Form fields will be rendered here -->
          </div>
          <div class="modal-footer" id="frameModalFooter">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="secondary cancel-btn">Cancel</button>
            <button type="button" class="danger delete-btn">Delete</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Options Editor Dialog -->
    <div class="options-dialog" id="optionsDialog">
      <div class="options-dialog-content">
        <div class="options-header">
          <h2>Edit Field Options</h2>
        </div>
        <form>
          <div class="field-selector">
            <label for="fieldSelect">Select Field</label>
            <select id="fieldSelect">
              <!-- Options will be populated dynamically -->
            </select>
          </div>
          <div class="options-list">
            <label>Options</label>
            <div id="optionsContainer">
              <!-- Option inputs will be rendered here -->
            </div>
            <button
              type="button"
              id="addOptionBtn"
              class="secondary"
              style="width: 100%; margin-top: 0.75rem"
            >
              + Add Option
            </button>
          </div>
          <div class="options-footer">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="secondary cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Create Roll Modal -->
    <div class="modal" id="createRollModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Create New Roll</h2>
        </div>
        <form id="createRollForm">
          <div class="modal-body">
            <div class="form-group">
              <label for="rollNameInput">Roll Name</label>
              <input
                type="text"
                id="rollNameInput"
                name="name"
                placeholder="e.g., Summer Break"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="save-btn">Create</button>
            <button type="button" class="secondary cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Edit Roll Modal -->
    <div class="modal" id="editRollModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Edit Roll</h2>
        </div>
        <form id="editRollForm">
          <div class="modal-body">
            <div class="form-group">
              <label for="rollEditNameInput">Roll Name</label>
              <input type="text" id="rollEditNameInput" name="name" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="secondary cancel-btn">Cancel</button>
            <button type="button" class="danger delete-btn" id="deleteRollModalBtn">
              Delete Roll
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="src/config.js"></script>
    <script src="src/rolls.js"></script>
    <script src="src/data.js"></script>
    <script src="src/table.js"></script>
    <script src="src/selectors.js"></script>
    <script src="src/export.js"></script>
    <script src="src/frame.js"></script>
    <script src="src/options.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
