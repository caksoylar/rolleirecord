<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Settings</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/png"
      href="assets/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Rolleirecord" />
    <link rel="manifest" href="assets/site.webmanifest" />
  </head>
  <body>
    <header>
      <h1>
        <a href="index.html" id="backLink" title="Back" aria-label="Back"
          ><svg class="icon"><use href="icons.svg#icon-left"></use></svg
        ></a>
        <span id="pageTitle">Settings</span>
      </h1>
    </header>
    <main>
      <p class="settings-group-label">Entities</p>
      <div class="settings-list">
        <button type="button" id="settingsEditCamera" class="settings-row">
          <span class="row-icon"
            ><svg class="icon"><use href="icons.svg#icon-camera"></use></svg
          ></span>
          <span class="row-label"><span class="row-title">Cameras</span></span>
          <span class="row-chevron"
            ><svg class="icon"><use href="icons.svg#icon-chevron"></use></svg
          ></span>
        </button>
        <button type="button" id="settingsEditFilms" class="settings-row">
          <span class="row-icon"
            ><svg class="icon"><use href="icons.svg#icon-film"></use></svg
          ></span>
          <span class="row-label"><span class="row-title">Films</span></span>
          <span class="row-chevron"
            ><svg class="icon"><use href="icons.svg#icon-chevron"></use></svg
          ></span>
        </button>
      </div>

      <p class="settings-group-label">Maps</p>
      <div class="settings-list">
        <div class="settings-row">
          <span class="row-icon"
            ><svg class="icon"><use href="icons.svg#icon-map"></use></svg
          ></span>
          <span class="row-label">
            <span class="row-title">Maps Service</span>
            <span class="row-sub">Used to open locations</span>
          </span>
          <select
            id="settingsMapsProvider"
            class="row-select"
            aria-label="Maps provider"
          >
            <option value="google">Google Maps</option>
            <option value="apple">Apple Maps</option>
            <option value="osm">OpenStreetMap</option>
          </select>
        </div>
        <label class="settings-row" title="Enable reverse geocoding">
          <span class="row-icon"
            ><svg class="icon"><use href="icons.svg#icon-pin"></use></svg
          ></span>
          <span class="row-label">
            <span class="row-title">Reverse Geocoding</span>
            <span class="row-sub"
              >Resolve coordinates with
              <a href="https://nominatim.org/">Nominatim</a></span
            >
          </span>
          <input type="checkbox" id="settingsEnableRGC" class="row-checkbox" />
        </label>
      </div>

      <p class="settings-group-label">Developer</p>
      <div class="settings-list">
        <button type="button" id="settingsFullExportBtn" class="settings-row">
          <span class="row-icon"
            ><svg class="icon"><use href="icons.svg#icon-upload"></use></svg
          ></span>
          <span class="row-label">
            <span class="row-title">Export Full Backup</span>
            <span class="row-sub"
              >Every roll, camera, and film stored on this device</span
            >
          </span>
        </button>
        <button type="button" id="settingsFullImportBtn" class="settings-row">
          <span class="row-icon"
            ><svg class="icon"><use href="icons.svg#icon-download"></use></svg
          ></span>
          <span class="row-label"
            ><span class="row-title">Import Full Backup</span></span
          >
        </button>
        <button type="button" id="settingsRefreshCacheBtn" class="settings-row">
          <span class="row-icon"
            ><svg class="icon"><use href="icons.svg#icon-refresh"></use></svg
          ></span>
          <span class="row-label"
            ><span class="row-title">Refresh Assets</span></span
          >
        </button>
        <button
          type="button"
          id="settingsClearAllBtn"
          class="settings-row danger-row"
        >
          <span class="row-icon"
            ><svg class="icon"><use href="icons.svg#icon-delete"></use></svg
          ></span>
          <span class="row-label"
            ><span class="row-title">Clear All Data</span></span
          >
        </button>
      </div>
    </main>

    <script src="src/util.js"></script>
    <script src="src/config.js"></script>
    <script src="src/entities.js"></script>
    <script src="src/rolls.js"></script>
    <script src="src/export.js"></script>
    <script src="src/settings.js"></script>
  </body>
</html>
