<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Rolleirecord</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/png"
      href="assets/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Rolleirecord" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").then((reg) => {
          reg.addEventListener("updatefound", () => {
            const newWorker = reg.installing;
            newWorker.addEventListener("statechange", () => {
              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                const banner = document.getElementById("updateBanner");
                if (banner) banner.style.display = "";
              }
            });
          });
        });
      }
    </script>
  </head>
  <body class="main-page">
    <button id="updateBanner" style="display: none">
      Update available — tap to reload
    </button>
    <header>
      <h1>
        <svg
          height="0.833em"
          width="0.833em"
          xmlns="http://www.w3.org/2000/svg"
          class="rec-icon"
          aria-hidden="true"
          focusable="false"
        >
          <circle
            id="recIconOuter"
            r="50%"
            cx="50%"
            cy="50%"
            fill="var(--color-danger)"
            opacity="40%"
          />
          <circle r="25%" cx="50%" cy="50%" fill="var(--color-danger)" />
        </svg>
        rollei(re)cord
      </h1>
      <button id="settingsBtn" title="Options">
        <svg class="icon"><use href="icons.svg#icon-options"></use></svg>
      </button>
    </header>
    <main>
      <p class="settings-group-label">Rolls</p>
      <div id="rollContainer" class="roll-selector-bar">
        <!-- Populated dynamically by RollSelector -->
      </div>

      <p class="settings-group-label">Frames</p>
      <div id="tableContainer">
        <!-- Table will be rendered here -->
      </div>

      <div id="mainActions" class="main-actions" style="display: none">
        <button id="addFrameFab" title="Add new frame">
          <svg class="icon"><use href="icons.svg#icon-add"></use></svg>
          <span>Add frame</span>
        </button>
        <button id="rollActionsFab" title="Roll actions" class="secondary">
          <svg class="icon"><use href="icons.svg#icon-list"></use></svg>
          <span>Roll actions</span>
        </button>
      </div>
    </main>

    <!-- Frame Modal -->
    <div
      class="modal"
      id="frameModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="frameModalTitle"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="frameModalTitle">Add Row</h2>
        </div>
        <form autocomplete="off">
          <div class="settings-list" id="frameModalBody">
            <!-- Form fields will be rendered here -->
          </div>
          <div class="modal-footer" id="frameModalFooter">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="danger delete-btn">Delete</button>
            <button type="button" class="secondary cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- New Roll Modal -->
    <div
      class="modal"
      id="newRollModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="newRollModalTitle"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="newRollModalTitle">New Roll</h2>
        </div>
        <p class="settings-group-label">Properties</p>
        <div id="newRollPropertiesList" class="settings-list">
          <!-- Populated dynamically by NewRollModal -->
        </div>
        <div class="modal-footer">
          <button type="button" id="newRollCreateBtn" class="save-btn">
            Create Roll
          </button>
          <button type="button" id="newRollCancelBtn" class="secondary">
            Cancel
          </button>
          <button type="button" id="newRollImportBtn" class="secondary">
            Import from file…
          </button>
        </div>
      </div>
    </div>

    <!-- Roll Actions Modal -->
    <div
      class="modal"
      id="rollActionsModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="rollActionsModalTitle"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="rollActionsModalTitle">Roll</h2>
        </div>
        <p class="settings-group-label">Properties</p>
        <div id="rollPropertiesList" class="settings-list">
          <!-- Populated dynamically by RollActionsModal -->
        </div>
        <p class="settings-group-label">Tools</p>
        <div class="settings-list">
          <button
            type="button"
            id="rollActionsInterpolateBtn"
            class="settings-row"
          >
            <span class="row-icon"
              ><svg class="icon">
                <use href="icons.svg#icon-interpolate"></use></svg
            ></span>
            <span class="row-label"
              ><span class="row-title">Interpolate Missing Frames</span
              ><span class="row-sub"
                >Fill in gaps between logged frames</span
              ></span
            >
            <span class="row-chevron"
              ><svg class="icon"><use href="icons.svg#icon-chevron"></use></svg
            ></span>
          </button>
          <button type="button" id="rollActionsMapBtn" class="settings-row">
            <span class="row-icon"
              ><svg class="icon"><use href="icons.svg#icon-map"></use></svg
            ></span>
            <span class="row-label"
              ><span class="row-title">View on Map</span
              ><span class="row-sub">Open frame locations in maps</span></span
            >
            <span class="row-chevron"
              ><svg class="icon"><use href="icons.svg#icon-chevron"></use></svg
            ></span>
          </button>
        </div>
        <p class="settings-group-label">Export</p>
        <div class="settings-list">
          <button
            type="button"
            id="rollActionsExportJsonBtn"
            class="settings-row"
          >
            <span class="row-icon"
              ><svg class="icon"><use href="icons.svg#icon-upload"></use></svg
            ></span>
            <span class="row-label"
              ><span class="row-title">Export Roll</span
              ><span class="row-sub">Back up as JSON for re-import</span></span
            >
          </button>
          <button
            type="button"
            id="rollActionsExportCsvBtn"
            class="settings-row"
          >
            <span class="row-icon"
              ><svg class="icon"><use href="icons.svg#icon-csv"></use></svg
            ></span>
            <span class="row-label"
              ><span class="row-title">Export CSV</span
              ><span class="row-sub"
                >Export metadata to use with exiftool</span
              ></span
            >
            <span class="row-chevron"
              ><svg class="icon"><use href="icons.svg#icon-chevron"></use></svg
            ></span>
          </button>
        </div>
        <p class="settings-group-label">Danger Zone</p>
        <div class="settings-list">
          <button
            type="button"
            id="rollActionsDeleteBtn"
            class="settings-row danger-row"
          >
            <span class="row-icon"
              ><svg class="icon"><use href="icons.svg#icon-delete"></use></svg
            ></span>
            <span class="row-label"
              ><span class="row-title">Delete Roll</span></span
            >
          </button>
        </div>
        <div class="modal-footer">
          <button type="button" class="secondary" id="rollActionsCloseBtn">
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- Roll Property Edit Modal: single-field input (nested on top of roll actions modal) -->
    <div
      class="modal"
      id="rollPropertyEditModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="rollPropertyEditTitle"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="rollPropertyEditTitle" class="modal-title"></h2>
        </div>
        <form id="rollPropertyEditForm" autocomplete="off">
          <div class="modal-body" id="rollPropertyEditBody">
            <!-- Single form-group rendered here -->
          </div>
          <div class="modal-footer">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="secondary cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="src/util.js"></script>
    <script src="src/config.js"></script>
    <script src="src/entities.js"></script>
    <script src="src/rolls.js"></script>
    <script src="src/location.js"></script>
    <script src="src/table.js"></script>
    <script src="src/roll-ui.js"></script>
    <script src="src/data-io.js"></script>
    <script src="src/frame.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
