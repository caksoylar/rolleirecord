<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rolleirecord</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/png"
      href="assets/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Rolleirecord" />
    <link rel="manifest" href="assets/site.webmanifest" />
  </head>
  <body>
    <button id="updateBanner" style="display: none">
      Update available — tap to reload
    </button>
    <header>
      <h1>
        <svg
          height="0.833em"
          width="0.833em"
          xmlns="http://www.w3.org/2000/svg"
          style="vertical-align: -0.125em"
          aria-hidden="true"
          focusable="false"
        >
          <circle r="50%" cx="50%" cy="50%" fill="var(--color-danger)" />
        </svg>
        rollei(re)cord
      </h1>
      <button id="settingsBtn" title="Options">
        <svg class="icon"><use href="icons.svg#icon-options"></use></svg>
      </button>
    </header>
    <main>
      <div id="rollContainer" class="roll-selector-bar">
        <!-- Populated dynamically by EntitySelector -->
      </div>

      <div class="entity-selector-group">
        <div id="cameraContainer" class="entity-selector-bar">
          <!-- Populated dynamically by EntitySelector -->
        </div>

        <div id="filmContainer" class="entity-selector-bar">
          <!-- Populated dynamically by EntitySelector -->
        </div>
      </div>

      <div id="tableContainer">
        <!-- Table will be rendered here -->
      </div>
    </main>

    <!-- FAB: Add new frame -->
    <button
      id="addFrameFab"
      title="Add new frame"
      style="display: none"
    >
      <svg class="icon"><use href="icons.svg#icon-add"></use></svg>
    </button>

    <!-- Settings Menu -->
    <div class="modal" id="settingsMenu" role="dialog" aria-modal="true" aria-labelledby="settingsMenuTitle">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="settingsMenuTitle">Settings</h2>
        </div>
        <div class="settings-section">
          <h3>Backup &amp; Restore</h3>
          <div class="settings-actions">
            <button id="settingsExportBtn" class="secondary">
              Export Backup
            </button>
            <button id="settingsImportBtn" class="secondary">
              Import Backup
            </button>
          </div>
        </div>
        <div class="settings-section">
          <h3>Export Metadata</h3>
          <p class="settings-caption">
            For use with exiftool to embed metadata in scanned photos. Edit the
            SourceFile column to match your filenames, then call
            <code>exiftool -csv=&lt;exported&gt;.csv &lt;files&gt;</code>.
          </p>
          <div class="settings-actions">
            <button id="settingsExportCSVBtn" class="secondary">
              Export CSV
            </button>
          </div>
        </div>
        <div class="settings-section">
          <h3>Developer</h3>
          <div class="settings-actions">
            <button id="settingsRefreshCacheBtn" class="secondary">
              Refresh Assets
            </button>
            <button id="settingsClearAllBtn" class="danger">
              Clear All Data
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="secondary cancel-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- Frame Modal -->
    <div class="modal" id="frameModal" role="dialog" aria-modal="true" aria-labelledby="frameModalTitle">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="frameModalTitle">Add Row</h2>
        </div>
        <form autocomplete="off">
          <div class="modal-body" id="frameModalBody">
            <!-- Form fields will be rendered here -->
          </div>
          <div class="modal-footer" id="frameModalFooter">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="secondary cancel-btn">Cancel</button>
            <button type="button" class="danger delete-btn">Delete</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Field Options Dialog -->
    <div class="modal" id="optionsDialog" role="dialog" aria-modal="true" aria-labelledby="optionsDialogTitle">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="optionsDialogTitle">Edit Field Options</h2>
        </div>
        <form autocomplete="off">
          <div class="field-selector">
            <label for="fieldSelect">Select Field</label>
            <select id="fieldSelect">
              <!-- Options will be populated dynamically -->
            </select>
          </div>
          <div id="visibilityToggle" style="display: none">
            <!-- Inline visibility toggle rendered here when applicable -->
          </div>
          <div class="options-list">
            <p class="options-list-heading">Options</p>
            <div id="optionsContainer">
              <!-- Option inputs will be rendered here -->
            </div>
            <button
              type="button"
              id="addOptionBtn"
              class="secondary"
              style="width: 100%; margin-top: 0.75rem"
            >
              + Add Option
            </button>
          </div>
          <div class="modal-footer">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="secondary cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").then((reg) => {
          reg.addEventListener("updatefound", () => {
            const newWorker = reg.installing;
            newWorker.addEventListener("statechange", () => {
              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                document.getElementById("updateBanner").style.display = "";
              }
            });
          });
        });
      }
    </script>
    <script src="src/config.js"></script>
    <script src="src/entities.js"></script>
    <script src="src/entity-modal.js"></script>
    <script src="src/rolls.js"></script>
    <script src="src/data.js"></script>
    <script src="src/table.js"></script>
    <script src="src/selectors.js"></script>
    <script src="src/exif.js"></script>
    <script src="src/export.js"></script>
    <script src="src/frame.js"></script>
    <script src="src/options.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
